name: orderflow
x-backend: &backend
  build: .
  image: orderflow:local
  restart: unless-stopped
  environment: &env
    DATABASE_URL: postgres://orderflow:${POSTGRES_PASSWORD:-orderflow-local-only}@db:5432/orderflow
    KAFKA_BROKERS: kafka:9092
    INTEGRATIONS_URL: http://integrations:4100
    INTEGRATIONS_TOKEN: ${INTEGRATIONS_TOKEN:-integration-demo-local}
    OPERATOR_TOKEN: ${OPERATOR_TOKEN:-operator-demo-local}
    ONCALL_TOKEN: ${ONCALL_TOKEN:-oncall-demo-local}
  depends_on:
    migrate: { condition: service_completed_successfully }
services:
  db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow-local-only}
      POSTGRES_DB: orderflow
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orderflow -d orderflow']
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    ports: ['127.0.0.1:9092:19092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ['kafka-data:/var/lib/kafka/data']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
  migrate:
    <<: *backend
    restart: 'no'
    command: ['npm', 'run', 'migrate', '-w', 'apps/api']
    depends_on:
      db: { condition: service_healthy }
  worker:
    <<: *backend
    environment:
      <<: *env
      APP_ROLE: worker
    ports: ['127.0.0.1:4000:4000']
    command: ['node', 'apps/api/dist/main.js']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
  integrations:
    <<: *backend
    environment:
      <<: *env
      APP_ROLE: integrations
    command: ['node', 'apps/api/dist/main.js']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
  hidden:
    <<: *backend
    environment:
      <<: *env
      APP_ROLE: hidden
    command: ['node', 'apps/api/dist/main.js']
    ports: ['127.0.0.1:4001:4001']
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      integrations: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 30
  web:
    <<: *backend
    command: ['npm', 'run', 'start', '-w', 'apps/web']
    environment:
      API_INTERNAL_URL: http://worker:4000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      worker: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 30
  prometheus:
    build: ./infra/prometheus
    image: orderflow-prometheus:local
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    ports: ['127.0.0.1:9090:9090']
    volumes: ['prometheus-data:/prometheus']
    depends_on:
      worker: { condition: service_healthy }
      hidden: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 15
  grafana:
    build: ./infra/grafana
    image: orderflow-grafana:local
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin-demo-local}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ['127.0.0.1:3001:3000']
    volumes: ['grafana-data:/var/lib/grafana']
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
