name: OrderFlow demo checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: orderflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run format:check && npm run check:architecture && npm run typecheck && npm test
      - name: Build and start the complete stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Database, outbox, inbox, concurrency and lease tests
        run: bash scripts/test-integration.sh
      - run: npx playwright install --with-deps chromium
      - name: Browser journeys including failure, alert and recovery
        run: npm run test:e2e
      - name: Generate Allure report
        if: always()
        run: npm run allure
      - name: Collect service evidence
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps -a > test-results/compose-status.txt
          docker compose logs --no-color > test-results/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orderflow-verification
          path: |
            playwright-report/
            allure-report/
            allure-results/
            test-results/
          retention-days: 14
      - name: Stop services, preserve named volumes until runner cleanup
        if: always()
        run: docker compose down
